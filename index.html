<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/Logo/Fichier%204.svg" />
    <link rel="apple-touch-icon" href="/Logo/Fichier%204@2x.png" />
    <meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)" />

    <!-- Balises SEO par défaut. Remplacées page par page par server/src/scripts/buildSeo.js
         (pages statiques) et par src/seo/useSeo.ts (navigation dans l'application). -->
    <!--seo:start-->
    <title>MonBaobab — Histoires, cultures et savoirs d’Afrique</title>
    <meta name="description" content="Histoires, cultures, savoirs et talents d’Afrique : fiches pays, personnalités, récits et proverbes, documentés et partagés par la communauté MonBaobab." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://monbaobab.com/" />
    <meta property="og:site_name" content="MonBaobab" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://monbaobab.com/" />
    <meta property="og:title" content="MonBaobab — Histoires, cultures et savoirs d’Afrique" />
    <meta property="og:description" content="Histoires, cultures, savoirs et talents d’Afrique : fiches pays, personnalités, récits et proverbes." />
    <meta property="og:image" content="https://monbaobab.com/og/monbaobab-default.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MonBaobab — Histoires, cultures et savoirs d’Afrique" />
    <meta name="twitter:description" content="Histoires, cultures, savoirs et talents d’Afrique : fiches pays, personnalités, récits et proverbes." />
    <meta name="twitter:image" content="https://monbaobab.com/og/monbaobab-default.jpg" />
    <!--seo:end-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Hepta+Slab:wght@700;800&display=swap" rel="stylesheet" />

    <!-- Instantané de contenu pré-généré (lisible sans JavaScript), remplacé par l'application au chargement -->
    <style>
      .seo-snapshot { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; font-family: 'Hanken Grotesk', system-ui, sans-serif; line-height: 1.6; color: #1d1b17; background: #faf7f1; }
      .seo-snapshot header { padding-bottom: 12px; margin-bottom: 24px; border-bottom: 1px solid #e3dbcc; font-weight: 700; }
      .seo-snapshot h1, .seo-snapshot h2 { font-family: 'Hepta Slab', Georgia, serif; line-height: 1.2; }
      .seo-snapshot a { color: #05662f; }
      .seo-snapshot nav { font-size: 14px; color: #6b665c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
